<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WishSync App — Mobile Responsive Status Pills Edition (V11.0)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #030712;
      --bg-mobile-app: #0b0f19;
      --bg-card: rgba(17, 24, 39, 0.95);
      --border-color: rgba(255, 255, 255, 0.1);
      --border-glow: rgba(168, 85, 247, 0.4);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --gradient-aurora: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-full: 9999px;
      --shadow-mobile: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    /* Lock HTML & Body so external web page never scrolls */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden !important;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Mode Bar */
    .mode-bar {
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 100;
      flex-shrink: 0;
    }
    .mode-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-btn:hover { background: rgba(255, 255, 255, 0.2); }

    /* iPhone Shell Frame Container */
    .phone-shell {
      width: 393px;
      height: 852px;
      max-height: 94vh;
      background: var(--bg-mobile-app);
      border-radius: 54px;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.9), 0 0 0 12px #1f2937, 0 0 0 13px #374151;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .phone-shell.full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    @media (max-width: 480px) {
      body { padding: 0; }
      .mode-bar { display: none; }
      .phone-shell {
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Dynamic Island Notch */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 30px;
      background: #000000;
      border-radius: 20px;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      pointer-events: none;
    }
    .camera-dot { width: 10px; height: 10px; background: #111; border-radius: 50%; border: 1px solid #222; }

    /* Status Bar */
    .status-bar {
      height: 48px;
      flex-shrink: 0;
      padding: 12px 24px 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
      z-index: 250;
      user-select: none;
      transition: all 0.2s ease;
    }
    .status-bar.immersive-transparent {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 250;
      pointer-events: none;
      background: transparent;
    }

    /* Top App Header Bar */
    .app-header {
      padding: 8px 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: rgba(11, 15, 25, 0.95);
      z-index: 240;
    }
    .logo-text {
      background: var(--gradient-aurora);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.15rem;
      font-weight: 800;
    }

    /* App Main Screen Scrollable Area */
    .app-screen {
      flex: 1 1 0%;
      min-height: 0;
      overflow-y: auto !important;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 12px 14px 90px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 100;
    }

    /* PREVENT FLEXBOX FROM SQUISHING CHILD CARDS & AVATARS */
    .app-screen > * {
      flex-shrink: 0 !important;
    }

    /* GLOBAL AVATAR PERFECT CIRCLE RULE */
    .avatar-img {
      flex-shrink: 0 !important;
      aspect-ratio: 1 / 1 !important;
      object-fit: cover !important;
      border-radius: 50% !important;
      display: block !important;
    }
    
    /* Elegant Thin Scrollbar */
    .app-screen::-webkit-scrollbar {
      width: 5px;
    }
    .app-screen::-webkit-scrollbar-track {
      background: transparent;
    }
    .app-screen::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.4);
      border-radius: 9999px;
    }

    /* Glass Cards */
    .mobile-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-mobile);
      flex-shrink: 0 !important;
    }
    .badge-aurora {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(236, 72, 153, 0.25));
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #c084fc;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-status {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 0.68rem;
      font-weight: 700;
    }

    .btn-aurora {
      background: var(--gradient-aurora);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-full);
      padding: 8px 16px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn-aurora:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: #ffffff;
      border-radius: var(--radius-full);
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn-secondary:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.15);
    }

    /* 4-Tab Bottom Navigation Bar */
    .bottom-tabbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 75px;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: 12px;
      z-index: 200;
    }
    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      flex: 1;
    }
    .tab-btn.active { color: #a855f7; }
    .tab-btn .icon { font-size: 1.3rem; }

    /* Horizontal Match Scroll */
    .match-scroll-container {
      display: flex;
      gap: 12px;
      overflow-x: auto !important;
      padding-bottom: 6px;
      margin-top: 6px;
      overscroll-behavior-x: contain;
      cursor: grab;
      user-select: none;
    }
    .match-scroll-container::-webkit-scrollbar { display: none; }
    .match-card-mini {
      flex-shrink: 0 !important;
      width: 170px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Category Filter & Status Filter Swipe Pills Horizontal Scroll */
    .category-pills-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto !important;
      padding: 4px 0 8px 0;
      overscroll-behavior-x: contain;
      cursor: grab;
      user-select: none;
    }
    .category-pills-scroll::-webkit-scrollbar { display: none; }

    /* Segmented Selector Bar for Time Filters */
    .time-range-bar {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      padding: 4px;
      gap: 4px;
    }
    .time-range-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px 0;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
    }
    .time-range-btn.active {
      background: var(--gradient-aurora);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(168, 85, 247, 0.4);
    }

    /* Visible Category Grid for Forms (Harmonious 2-Column Balanced Grid) */
    .category-grid-wrap {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 4px 0;
    }

    .category-grid-wrap .category-pill-btn {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: var(--radius-full);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category-pill-btn {
      flex-shrink: 0 !important;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: var(--radius-full);
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .category-pill-btn.active {
      background: var(--gradient-aurora);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 2px 10px rgba(168,85,247,0.35);
    }

    /* Option 3: Home Dual-View Switcher (Wishes vs Moments Feed) */
    .home-view-switcher {
      display: flex;
      background: rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: var(--radius-full);
      padding: 3px;
      margin-bottom: 12px;
      backdrop-filter: blur(12px);
    }
    .home-view-btn {
      flex: 1;
      padding: 7px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.22s ease;
    }
    .home-view-btn.active {
      background: var(--gradient-aurora);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(168, 85, 247, 0.38);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Home Bar Indicator */
    .home-indicator {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 135px;
      height: 4px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 9999px;
      z-index: 210;
      pointer-events: none;
    }

    /* Bottom Sheet Slidup Modals */
    .sheet-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 400;
      display: flex;
      align-items: flex-end;
    }
    .sheet-body {
      background: #0f172a;
      border-top: 1px solid var(--border-color);
      border-radius: 28px 28px 0 0;
      width: 100%;
      max-height: 82vh;
      overflow-y: auto;
      padding: 18px 20px 30px 20px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sheet-handle {
      width: 38px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      margin: 0 auto 14px auto;
    }
    .theme-gallery-slide {
      transition: opacity 0.25s ease;
      box-sizing: border-box;
    }
    /* Mobile Roller Date Wheel Picker (iOS / Android 滚轮选择器) */
    .mobile-wheel-picker-wrapper {
      position: relative;
      height: 210px;
      overflow: hidden;
      background: rgba(8, 6, 22, 0.65);
      border-radius: 16px;
      border: 1px solid rgba(168, 85, 247, 0.25);
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.6);
      margin-bottom: 14px;
      user-select: none;
    }
    .wheel-highlight-lens {
      position: absolute;
      top: 84px;
      left: 6px;
      right: 6px;
      height: 42px;
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.12), rgba(236, 72, 153, 0.16), rgba(168, 85, 247, 0.12));
      border-top: 1.5px solid rgba(168, 85, 247, 0.5);
      border-bottom: 1.5px solid rgba(168, 85, 247, 0.5);
      border-radius: 10px;
      pointer-events: none;
      z-index: 2;
    }
    .wheel-gradient-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 84px;
      background: linear-gradient(to bottom, #0f172a 15%, rgba(15, 23, 42, 0.8) 60%, transparent 100%);
      pointer-events: none;
      z-index: 3;
    }
    .wheel-gradient-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 84px;
      background: linear-gradient(to top, #0f172a 15%, rgba(15, 23, 42, 0.8) 60%, transparent 100%);
      pointer-events: none;
      z-index: 3;
    }
    .wheel-scroll-col {
      height: 210px;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      padding: 84px 0;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .wheel-scroll-col::-webkit-scrollbar {
      display: none;
    }
    .wheel-picker-item {
      height: 42px;
      line-height: 42px;
      text-align: center;
      scroll-snap-align: center;
      font-size: 0.92rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: color 0.15s ease, transform 0.15s ease, font-size 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
    }
    .wheel-picker-item.wheel-item-selected {
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(168, 85, 247, 0.7);
      transform: scale(1.05);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes aiScanLaser {
      0% { top: 0%; opacity: 0.9; }
      50% { top: 96%; opacity: 1; }
      100% { top: 0%; opacity: 0.9; }
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
      50% { box-shadow: 0 0 30px rgba(236, 72, 153, 0.8); }
      100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    /* Sleek Dual Range Slider */
    .dual-range-container {
      position: relative;
      height: 38px;
      display: flex;
      align-items: center;
      margin: 12px 6px 6px 6px;
    }
    .dual-range-track {
      position: absolute;
      left: 0;
      right: 0;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      pointer-events: none;
    }
    .dual-range-highlight {
      position: absolute;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, #a855f7 0%, #ec4899 100%);
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.55);
      pointer-events: none;
      transition: left 0.04s ease, width 0.04s ease;
    }
    .dual-range-input {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 38px;
      background: none;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
      padding: 0;
    }
    .dual-range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #a855f7;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 10px rgba(168, 85, 247, 0.6);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .dual-range-input::-webkit-slider-thumb:active {
      transform: scale(1.15);
      border-color: #ec4899;
      box-shadow: 0 2px 12px rgba(236, 72, 153, 0.85);
    }
    .dual-range-input::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #a855f7;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 10px rgba(168, 85, 247, 0.6);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .dual-range-input::-moz-range-thumb:active {
      transform: scale(1.15);
      border-color: #ec4899;
      box-shadow: 0 2px 12px rgba(236, 72, 153, 0.85);
    }
    .dual-range-input::-webkit-slider-runnable-track {
      background: transparent;
      border: none;
    }
    .dual-range-input::-moz-range-track {
      background: transparent;
      border: none;
    }
    .dual-range-input:focus {
      outline: none;
    }
  </style>
</head>
<body>

  <!-- iPhone Shell Frame Container -->
  <div class="phone-shell" id="phone-shell">
    
    <!-- Dynamic Island Notch -->
    <div class="dynamic-island">
      <div class="camera-dot"></div>
      <div style="width: 8px; height: 8px; background: #10b981; border-radius: 50%;"></div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar immersive-transparent" id="status-bar" style="position: absolute; top: 0; left: 0; right: 0; z-index: 250; pointer-events: none;">
      <span>9:41</span>
      <div style="display: flex; gap: 6px; align-items: center;">
        <span style="font-size: 0.75rem;">5G</span>
        <span style="font-size: 0.85rem;">🔋</span>
      </div>
    </div>

    <!-- Top Header -->
    <div class="app-header" id="app-header">
      <!-- Dynamic Header Rendered by JS -->
    </div>

    <!-- App Screen Area (Scrollable Container) -->
    <div class="app-screen" id="app-screen">
      <!-- Content rendered dynamically -->
    </div>

    <!-- Bottom Navigation Bar / Action Bar -->
    <div class="bottom-tabbar" id="app-tabbar">
      <!-- Dynamic Tabbar Rendered by JS -->
    </div>

    <!-- Home Indicator Bar -->
    <div class="home-indicator"></div>

    <!-- WeChat Moments Fixed Drag-to-Delete Zone at Screen Bottom (Top-most layer) -->
    <div id="media-delete-zone" ondragover="event.preventDefault(); this.style.background='linear-gradient(to top, #dc2626, #b91c1c)'" ondragleave="this.style.background='linear-gradient(to top, rgba(239,68,68,0.98), rgba(220,38,38,0.95))'" ondrop="window.handleMediaDropDelete(event)" style="display: none; position: absolute; bottom: 0; left: 0; right: 0; z-index: 500; padding: 20px 16px 32px; background: linear-gradient(to top, rgba(239,68,68,0.98), rgba(220,38,38,0.95)); color: #fff; text-align: center; border-top: 1px solid rgba(255,255,255,0.3); box-shadow: 0 -6px 25px rgba(239,68,68,0.5); flex-direction: column; align-items: center; justify-content: center; gap: 4px; pointer-events: auto; animation: pulseGlow 2s infinite ease-in-out;">
      <span style="font-size: 1.5rem;">🗑️</span>
      <span style="font-size: 0.88rem; font-weight: 800; letter-spacing: 0.5px;">Drag here to delete</span>
    </div>

    <!-- Dynamic Slidup Sheet Overlay -->
    <div class="sheet-overlay" id="sheet-overlay" style="display: none;" onclick="closeSheet()">
      <div class="sheet-body" onclick="event.stopPropagation()" id="sheet-content">
        <!-- Sheet Content -->
      </div>
    </div>

    window.handleMemoryMediaFileChange = function(e) {
      const pageTextarea = document.getElementById('page-memory-text');
      if (pageTextarea) currentMemoryDraftText = pageTextarea.value;
      if (!e || !e.target || !e.target.files || e.target.files.length === 0) return;

      const files = Array.from(e.target.files);
      const remainingSlots = 9 - selectedMemoryMedia.length;
      if (remainingSlots <= 0) {
        alert('最多只能选择9张图片或者视频！');
        return;
      }

      if (files.length > remainingSlots) {
        alert(`最多只能选择9张图片或者视频，已自动选取前 ${remainingSlots} 项`);
      }

      const filesToProcess = files.slice(0, remainingSlots);
      let loadedCount = 0;
      filesToProcess.forEach(file => {
        const isVideo = file.type.startsWith('video');
        const reader = new FileReader();
        reader.onload = function(evt) {
          selectedMemoryMedia.push({
            type: isVideo ? 'video' : 'image',
            url: evt.target.result
          });
          loadedCount++;
          if (loadedCount === filesToProcess.length) {
            window.syncMemoryMediaState();
            render();
          }
        };
        reader.readAsDataURL(file);
      });
    };

    window.clearMediaPressTimer = function() {
      if (mediaLongPressTimer) {
        clearTimeout(mediaLongPressTimer);
        mediaLongPressTimer = null;
      }
    };

    let isMediaInDeleteZone = false;

    window.showMediaDeleteZone = function(index) {
      activeDraggingMediaIndex = (index !== undefined ? index : -1);
      const zone = document.getElementById('media-delete-zone');
      if (zone) {
        zone.style.background = 'linear-gradient(to top, rgba(239,68,68,0.98), rgba(220,38,38,0.95))';
        zone.style.display = 'flex';
      }
    };

    window.hideMediaDeleteZone = function() {
      window.clearMediaPressTimer();
      activeDraggingMediaIndex = -1;
      isMediaInDeleteZone = false;
      const zone = document.getElementById('media-delete-zone');
      if (zone) {
        zone.style.display = 'none';
      }
    };

    window.startMediaLongPress = function(e, index) {
      window.clearMediaPressTimer();
      activeDraggingMediaIndex = index;
      mediaLongPressTimer = setTimeout(() => {
        window.showMediaDeleteZone(index);
      }, 350);
    };

    window.cancelMediaLongPress = function() {
      window.clearMediaPressTimer();
      window.hideMediaDeleteZone();
    };

    window.handleMediaTouchMove = function(e) {
      if (activeDraggingMediaIndex < 0) return;
      const zone = document.getElementById('media-delete-zone');
      if (!zone || zone.style.display === 'none') return;
      const touch = e.touches && e.touches[0];
      if (!touch) return;
      const rect = zone.getBoundingClientRect();
      if (touch.clientY >= rect.top && touch.clientY <= rect.bottom &&
          touch.clientX >= rect.left && touch.clientX <= rect.right) {
        isMediaInDeleteZone = true;
        zone.style.background = 'linear-gradient(to top, #dc2626, #b91c1c)';
      } else {
        isMediaInDeleteZone = false;
        zone.style.background = 'linear-gradient(to top, rgba(239,68,68,0.98), rgba(220,38,38,0.95))';
      }
    };

    window.handleMediaTouchEnd = function(e, index) {
      window.clearMediaPressTimer();
      const idx = activeDraggingMediaIndex >= 0 ? activeDraggingMediaIndex : index;
      if (isMediaInDeleteZone && idx >= 0 && idx < selectedMemoryMedia.length) {
        window.removeMemoryMediaItem(idx);
      }
      isMediaInDeleteZone = false;
      window.hideMediaDeleteZone();
    };

    window.handleMediaDragStart = function(e, index) {
      activeDraggingMediaIndex = index;
      window.showMediaDeleteZone(index);
      if (e && e.dataTransfer) {
        e.dataTransfer.setData('text/plain', index.toString());
      }
    };

    window.handleMediaDragEnd = function(e) {
      window.hideMediaDeleteZone();
    };

    window.handleMediaDropDelete = function(e) {
      if (e) e.preventDefault();
      let idx = activeDraggingMediaIndex;
      if (e && e.dataTransfer) {
        const raw = e.dataTransfer.getData('text/plain');
        if (raw !== '') idx = parseInt(raw, 10);
      }
      if (idx >= 0 && idx < selectedMemoryMedia.length) {
        window.removeMemoryMediaItem(idx);
      }
      window.hideMediaDeleteZone();
    };

    window.postWishMemory = function(wishId, text, stage, imgUrl) {
      const wid = wishId || selectedWishId || 'w1';
      const pageTextarea = document.getElementById('page-memory-text');
      const inlineTextarea = document.getElementById('inline-memory-text');
      const modalTextarea = document.getElementById('modal-memory-text');
      const rawText = (text !== undefined && text !== null ? text : (pageTextarea ? pageTextarea.value : (inlineTextarea ? inlineTextarea.value : (modalTextarea ? modalTextarea.value : ''))));
      const content = (rawText || '').trim();
      if (!content) {
        alert('Please write a story or feeling for this memory moment!');
        return;
      }
      const stageKey = stage || selectedMemoryStage || 'Wish Fulfilled';
      const stageObj = MEMORY_STAGES.find(s => s.id === stageKey || s.label.includes(stageKey)) || MEMORY_STAGES[0];
      const mediaList = selectedMemoryMedia.length > 0 ? [...selectedMemoryMedia] : (imgUrl ? [{ type: 'image', url: imgUrl }] : (selectedMemoryImgUrl ? [{ type: 'image', url: selectedMemoryImgUrl }] : []));
      const primaryPhoto = (imgUrl !== undefined && imgUrl !== null ? imgUrl : (mediaList.length > 0 ? mediaList[0].url : '')) || '';
      const allPhotos = mediaList.map(m => m.url);
      const w = WISHES.find(x => x.id === wid) || WISHES[0];

      const newMem = {
        id: 'mem_' + Date.now(),
        author: MOCK_USER.name,
        authorAvatar: MOCK_USER.avatar,
        isCreator: true,
        stage: stageObj.id,
        stageIcon: stageObj.icon,
        stageColor: stageObj.color,
        stageBg: stageObj.bg,
        stageBorder: stageObj.border,
        time: 'Just now',
        location: w.location || 'Reykjavik, Iceland',
        text: content,
        image: primaryPhoto,
        images: allPhotos,
        media: mediaList,
        likes: 1,
        liked: true,
        comments: []
      };

      if (!WISH_MEMORIES[wid]) {
        WISH_MEMORIES[wid] = [];
      }
      WISH_MEMORIES[wid].unshift(newMem);

      currentMemoryDraftText = '';
      selectedMemoryImgUrl = '';
      if (typeof closeSheet === 'function') {
        closeSheet();
      }
      if (currentTab === 'record_memory') {
        window.goBack();
      } else {
        render();
      }
    };

    window.toggleMemoryLike = function(wishId, memId) {
      const wid = wishId || selectedWishId || 'w1';
      const list = WISH_MEMORIES[wid] || [];
      const mem = list.find(m => m.id === memId);
      if (mem) {
        if (mem.liked) {
          mem.liked = false;
          mem.likes = Math.max(0, mem.likes - 1);
        } else {
          mem.liked = true;
          mem.likes += 1;
        }
        render();
      }
    };

      if (!mem) return;

      let commentText = text;
      if (!commentText) {
        commentText = prompt('Share your thoughts or cheer for this memory:');
      }
      if (!commentText || !commentText.trim()) return;

      mem.comments.push({
        user: MOCK_USER.name,
        avatar: MOCK_USER.avatar,
        time: 'Just now',
        text: commentText.trim(),
        likes: 0,
        liked: false

      if (mem && mem.comments && mem.comments[commentIdx]) {

          c.likes = Math.max(0, (c.likes || 1) - 1);

    window.initThemeGallerySwipe = function() {
      if (typeof document === 'undefined') return;
      setTimeout(() => {
        const container = document.getElementById('theme-gallery-track');
        if (!container) return;
        const pageKeys = ['wishes', 'matches', 'space', 'profile'];
        const currentIdx = Math.max(0, pageKeys.indexOf(themePreviewPage));
        if (typeof window.updateThemeGalleryScales === 'function') {
          window.updateThemeGalleryScales(currentIdx);
        }

        let isDown = false;
        let startX = 0;
        let scrollLeft = 0;
        container.onmousedown = (e) => {
          isDown = true;
          if (container.style) container.style.cursor = 'grabbing';
          startX = e.pageX - (container.offsetLeft || 0);
          scrollLeft = container.scrollLeft || 0;
        };
        container.onmouseleave = () => { isDown = false; if (container.style) container.style.cursor = 'grab'; };
        container.onmouseup = () => { isDown = false; if (container.style) container.style.cursor = 'grab'; };
        container.onmousemove = (e) => {
          if (!isDown) return;
          if (e.preventDefault) e.preventDefault();
          const x = e.pageX - (container.offsetLeft || 0);
          const walk = (x - startX) * 1.5;
          container.scrollLeft = scrollLeft - walk;
        };
        container.onscroll = () => {
          const step = container.clientWidth || container.offsetWidth || 347;
          const pageIndex = Math.min(3, Math.max(0, Math.round((container.scrollLeft || 0) / step)));
          themePreviewPage = pageKeys[pageIndex];
          if (typeof window.updateThemeGalleryScales === 'function') {
            window.updateThemeGalleryScales(pageIndex);
          }
          const targetTheme = APP_THEMES.find(t => t.name === previewThemeTarget) || APP_THEMES[0];
          const dots = document.querySelectorAll ? document.querySelectorAll('.theme-gallery-dot') : [];
          dots.forEach((dot, idx) => {
            if (dot && dot.style) {

              dot.style.width = (idx === pageIndex) ? '18px' : '6px';
            }
          });
        };
      }, 40);
    };

    window.updateOnboardingBirth = function(optYear, optMonth, optDay) {
      if (optYear) onboardingYear = parseInt(optYear);

      if (optDay) onboardingDay = parseInt(optDay);

      const maxDays = getDaysInMonth(onboardingYear, onboardingMonth);

    function bindDragScroll() {
      document.querySelectorAll('.category-pills-scroll, .match-scroll-container').forEach(el => {
        let isDown = false;
        let startX;
        let scrollLeft;

        el.addEventListener('mousedown', (e) => {
          isDown = true;
          el.style.cursor = 'grabbing';
          startX = e.pageX - el.offsetLeft;
          scrollLeft = el.scrollLeft;
        });
        el.addEventListener('mouseleave', () => { isDown = false; el.style.cursor = 'grab'; });
        el.addEventListener('mouseup', () => { isDown = false; el.style.cursor = 'grab'; });
        el.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - el.offsetLeft;
          const walk = (x - startX) * 2;
          el.scrollLeft = scrollLeft - walk;
        });
      });
    }

                                ${isHot ? `<span style="font-size: 0.58rem; color: #f43f5e; background: rgba(244,63,94,0.14); border: 1px solid rgba(244,63,94,0.3); border-radius: 3px; padding: 0 4px; font-weight: 700;">HOT</span>` : ''}
                              </div>
                              <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="font-size: 0.62rem; color: var(--text-muted);">${topComment.time}</span>
                                <span onclick="event.stopPropagation(); window.toggleCommentLike('${w.id}', '${m.id}', ${topCommentOrigIdx});" style="cursor: pointer; font-size: 0.65rem; color: ${topComment.liked ? '#ec4899' : 'var(--text-muted)'}; display: flex; align-items: center; gap: 2px;">
                                  <span>${topComment.liked ? '❤️' : '🤍'}</span>
                                  <span>${topComment.likes || 0}</span>
                                </span>
                              </div>
                            </div>
                            <div style="font-size: 0.74rem; color: #94a3b8; line-height: 1.4;">${topComment.text}</div>
                          </div>
                        </div>

                        <!-- Expand / View all comments entry when > 1 comments -->
                        ${m.comments.length > 1 ? `
                          <div onclick="window.openMemoryCommentsSheet('${w.id}', '${m.id}')" style="margin-top: 8px; padding: 4px 6px; font-size: 0.72rem; color: #c084fc; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-radius: 6px; transition: background 0.15s;" onmouseover="this.style.background='rgba(192,132,252,0.08)'" onmouseout="this.style.background='transparent'">
                            <span>💬 View all ${m.comments.length} comments</span>
                            <span style="font-size: 0.8rem;">›</span>
                          </div>
                        ` : ''}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          `}

          <div style="height: 40px;"></div>
        `;
      } else if (currentTab === 'record_memory') {
        const w = WISHES.find(x => x.id === selectedWishId) || WISHES[0];
        screen.innerHTML = `
          <!-- 1. Wish Target Context Banner -->
          <div class="mobile-card" style="padding: 12px 14px; background: linear-gradient(135deg, rgba(30, 27, 75, 0.7) 0%, rgba(88, 28, 135, 0.45) 100%); border: 1px solid rgba(168, 85, 247, 0.45); display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 18px rgba(0,0,0,0.3);">
            <img src="${w.cover}" style="width: 52px; height: 52px; border-radius: 12px; object-fit: cover; border: 2px solid rgba(168,85,247,0.4); flex-shrink: 0;" />
            <div style="flex-grow: 1; min-width: 0;">
              <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 2px;">
                <span class="badge-aurora" style="font-size: 0.62rem; padding: 2px 7px;">${w.category}</span>
                <span style="font-size: 0.68rem; color: #34d399; font-weight: 700;">${w.status}</span>
              </div>
              <h4 style="font-size: 0.92rem; font-weight: 800; color: #fff; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${w.title}</h4>
              <div style="font-size: 0.7rem; color: #c084fc; margin-top: 2px;">Posting to Wish Memoir · 📍 ${w.location}</div>
            </div>
          </div>

          <!-- 2. Memory Story & Reflections -->
          <div class="mobile-card" style="padding: 14px;">
            <div style="margin-bottom: 10px;">
              <label style="font-size: 0.84rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px;">
                <span>✍️</span> Your Memory Story
              </label>
            </div>
            <textarea id="page-memory-text" oninput="currentMemoryDraftText = this.value" rows="5" placeholder="What feelings, breakthroughs, or scenery touched your heart? Record this fulfillment moment to inspire fellow resonators..." style="width: 100%; border-radius: 12px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.12); color: #fff; font-size: 0.84rem; padding: 12px; outline: none; resize: none; line-height: 1.55; box-sizing: border-box; transition: border-color 0.2s;" onfocus="this.style.borderColor='#a855f7'" onblur="this.style.borderColor='rgba(255,255,255,0.12)'">${currentMemoryDraftText}</textarea>
          </div>

          <!-- 3. WeChat-Style Moments Media 9-Grid (Max 9 Photos/Videos) -->
          <div class="mobile-card" data-selected-var="selectedMemoryImgUrl" data-selected-img="${selectedMemoryImgUrl}" style="padding: 14px; position: relative;">
            <!-- Hidden native file inputs for camera and album -->
            <input type="file" id="memory-camera-input" accept="image/*,video/*" capture="environment" style="display: none;" onchange="window.handleMemoryMediaFileChange(event)" />
            <input type="file" id="memory-album-input" accept="image/*,video/*" multiple style="display: none;" onchange="window.handleMemoryMediaFileChange(event)" />

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <label style="font-size: 0.84rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px;">
                <span>📸</span> Attach Memory Photos
              </label>
            </div>

            <!-- WeChat 9-Grid Layout (3 columns) -->
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
              ${selectedMemoryMedia.map((item, idx) => `
                <div class="wechat-media-item" draggable="true"
                     ondragstart="window.handleMediaDragStart(event, ${idx})"
                     ondragend="window.handleMediaDragEnd(event)"
                     onmousedown="window.startMediaLongPress(event, ${idx})"
                     onmouseup="window.cancelMediaLongPress()"
                     onmouseleave="window.cancelMediaLongPress()"
                     ontouchstart="window.startMediaLongPress(event, ${idx})"
                     ontouchmove="window.handleMediaTouchMove(event)"
                     ontouchend="window.handleMediaTouchEnd(event, ${idx})"
                     ontouchcancel="window.cancelMediaLongPress()"
                     style="position: relative; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,255,255,0.12); cursor: grab; user-select: none;">
                  ${item.type === 'video' ? `
                    <video src="${item.url}" style="width: 100%; height: 100%; object-fit: cover;" muted playsinline></video>
                    <div style="position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.65); border-radius: 4px; padding: 1px 4px; font-size: 0.62rem; color: #fff; display: flex; align-items: center; gap: 3px;">
                      <span>▶</span> Video
                    </div>
                  ` : `
                    <img src="${item.url}" style="width: 100%; height: 100%; object-fit: cover; display: block;" />
                  `}
                </div>
              `).join('')}

              <!-- WeChat Plus Button (Hides when 9 items are selected) -->
              ${selectedMemoryMedia.length < 9 ? `
                <div id="wechat-media-add-btn" onclick="window.openWechatMediaActionSheet()" style="aspect-ratio: 1 / 1; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1.5px dashed rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s ease;" onmouseover="this.style.borderColor='#a855f7'; this.style.background='rgba(168,85,247,0.1)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.25)'; this.style.background='rgba(255,255,255,0.06)'">
                  <span style="font-size: 2rem; color: rgba(255,255,255,0.6); line-height: 1; font-weight: 300;">+</span>
                </div>
              ` : ''}
            </div>
          </div>

          <!-- 4. Location Tag Card -->
          <div class="mobile-card" style="padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #e2e8f0; font-weight: 700;">
              <span style="color: #f43f5e; font-size: 0.95rem;">📍</span>
              <span>${w.location}</span>
            </div>
            <span style="font-size: 0.7rem; color: #34d399; font-weight: 700; background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.25); border-radius: var(--radius-full); padding: 2px 8px;">Auto Check-in</span>
          </div>
          <div style="height: 30px;"></div>
        `;
      } else if (currentTab === 'create_wish') {
        screen.innerHTML = `
          <form id="create-wish-form" onsubmit="window.handleCreateWishForm(event)" style="display: flex; flex-direction: column; gap: 14px;">
            
            <!-- Step 1: Select Category -->
            <div class="mobile-card" style="padding: 14px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <label style="font-size: 0.84rem; font-weight: 800; color: #fff; margin: 0;">1. Select Wish Category</label>
                <span style="font-size: 0.68rem; color: #c084fc; font-weight: 700;">8 Categories</span>
              </div>
              <div class="category-grid-wrap">
                ${CATEGORY_PILLS.filter(p => p.id !== 'All').map(p => {
                  const parts = p.label.split(' ');
                  const icon = parts[0];
                  const title = parts.slice(1).join(' ');
                  return `
                    <button type="button" class="category-pill-btn ${newWishCategory === p.id ? 'active' : ''}" onclick="selectNewWishCat('${p.id}')">
                      <span style="font-size: 0.88rem; line-height: 1; flex-shrink: 0;">${icon}</span>
                      <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${title}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Step 2: Title -->
            <div class="mobile-card" style="padding: 14px;">
              <label style="font-size: 0.84rem; font-weight: 800; color: #fff; margin-bottom: 8px; display: block;">2. Wish Title</label>
              <input type="text" id="new-wish-title" required placeholder="e.g. Watch Northern Lights in Iceland / Campervan road trip across NZ" style="width: 100%; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; font-size: 0.85rem; outline: none;" />
            </div>

            <!-- Step 3: Story -->
            <div class="mobile-card" style="padding: 14px;">
              <label style="font-size: 0.84rem; font-weight: 800; color: #fff; margin-bottom: 8px; display: block;">3. Wish Story & Experience Description</label>
              <textarea id="new-wish-story" rows="3" placeholder="Describe the details, aspirations, and background of what you want to experience..." style="width: 100%; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; font-size: 0.85rem; outline: none; line-height: 1.5;"></textarea>
            </div>

            <!-- Step 4: Companion Expectations -->
            <div class="mobile-card" style="padding: 14px; border: 1px solid rgba(168,85,247,0.4); background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(236,72,153,0.1));">
              <label style="font-size: 0.84rem; font-weight: 800; color: #c084fc; margin-bottom: 8px; display: flex; align-items: center; gap: 4px;">
                ✨ 4. Companion Expectations
              </label>
              <textarea id="new-wish-partner" rows="2" placeholder="e.g. Seeking open-minded companions who love photography, star-gazing, and outdoor adventure!" style="width: 100%; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(168,85,247,0.3); color: #fff; font-size: 0.85rem; outline: none; line-height: 1.5;"></textarea>
            </div>

            <!-- Step 5: Location -->
            <div class="mobile-card" style="padding: 14px;">
              <label style="font-size: 0.84rem; font-weight: 800; color: #fff; margin-bottom: 8px; display: block;">5. Destination / Location</label>
              <input type="text" id="new-wish-location" placeholder="📍 e.g. Reykjavik, Iceland" style="width: 100%; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; font-size: 0.85rem; outline: none;" />
            </div>

            <!-- Step 6: Cover Preview -->
            <div class="mobile-card" style="padding: 14px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <label style="font-size: 0.84rem; font-weight: 800; color: #fff;">6. Cover Image</label>
                <span class="badge-aurora" style="font-size: 0.65rem;">✨ AI Match Active</span>
              </div>
              <div style="position: relative; height: 125px; border-radius: 12px; overflow: hidden; margin-bottom: 8px; border: 1px solid var(--border-color);" id="cover-preview-box">
                <img id="new-wish-cover-img" src="${SAMPLE_COVERS[currentCoverIndex]}" style="width: 100%; height: 100%; object-fit: cover;" />
                <div style="position: absolute; bottom: 8px; right: 8px; display: flex; gap: 6px;">
                  <button type="button" class="btn-secondary" style="font-size: 0.7rem; padding: 4px 10px; background: rgba(0,0,0,0.65);" onclick="window.shuffleCover()">📷 Shuffle (AI)</button>
                  <button type="button" class="btn-secondary" style="font-size: 0.7rem; padding: 4px 10px; background: rgba(0,0,0,0.65);" onclick="alert('Open local photo picker')">📁 Upload Photo</button>
                </div>
              </div>
              <span style="font-size: 0.7rem; color: var(--text-muted);">💡 Tip: High-res cover matched automatically by AI based on category & title. You can shuffle or upload your own.</span>
            </div>


          </form>
        `;
      }

      bindDragScroll();
    }

    function toggleHeart(id) {
      WISHES = WISHES.map(w => w.id === id ? { ...w, hearted: !w.hearted, hearts: w.hearted ? w.hearts - 1 : w.hearts + 1 } : w);
      render();
    }

    function openAllMatchesSheet() {
      const sheet = document.getElementById('sheet-content');
      sheet.innerHTML = `
        <div class="sheet-handle"></div>
        <h3 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 12px;">⚡ All Matched Resonators</h3>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          ${MATCHES.map(m => `
            <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
              <div style="display: flex; gap: 10px; align-items: center;">
                <img src="${m.avatar}" class="avatar-img" style="width: 38px; height: 38px;" />
                <div>
                  <h4 style="font-size: 0.88rem; font-weight: 700; color: #fff;">${m.name}</h4>
                  <span style="font-size: 0.7rem; color: #c084fc;">⚡ ${m.score}% Match</span>
                </div>
              </div>
              <button class="btn-aurora" style="padding: 4px 10px; font-size: 0.72rem;" onclick="closeSheet(); window.openChatWithUser('${m.name}', 'w1');">💬 Start Chat</button>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('sheet-overlay').style.display = 'flex';
    }

    function openPremiumSheet() {
      const sheet = document.getElementById('sheet-content');
      sheet.innerHTML = `
        <div class="sheet-handle"></div>
        <div style="font-size: 2rem; margin-bottom: 6px; text-align: center;">👑</div>
        <h3 style="font-size: 1.2rem; font-weight: 800; text-align: center;">WishSync VIP</h3>
        <p style="font-size: 0.78rem; color: var(--text-secondary); margin: 6px 0 14px 0; text-align: center;">Say hi to dreamers who visited you, unblur all visitor identities, and start direct conversations!</p>
        <button class="btn-aurora" style="width: 100%; padding: 12px; font-weight: 700; margin-bottom: 8px;" onclick="window.unlockPremiumVisitors()">Unlock Membership ($3.99/mo)</button>
        <button class="btn-secondary" style="width: 100%; padding: 10px; font-size: 0.78rem; font-weight: 700; color: #fbbf24; border-color: rgba(251,191,36,0.3);" onclick="closeSheet(); window.openVipPaywallPage();">View All 7 VIP Privileges & Plans &gt;</button>
      `;
      document.getElementById('sheet-overlay').style.display = 'flex';
    }

    function closeSheet() { document.getElementById('sheet-overlay').style.display = 'none'; }

    // Full-Screen Matches Filter Navigation & Management
    window.openMatchesFilterPage = function() {
      tempMatchesFilter = { ...matchesFilter };
      if (!tempMatchesFilter.nationalityFlag) {
        if (tempMatchesFilter.nationality === 'all') {
          tempMatchesFilter.nationalityFlag = '🌐';
        } else {
          const c = ONBOARDING_COUNTRIES.find(x => x.name === tempMatchesFilter.nationality);
          tempMatchesFilter.nationalityFlag = c ? c.flag : '🚩';
        }
      }
      navStack.push('matches_filter');
      currentTab = 'matches_filter';
      render();
    };

    window.openFilterNationalityPage = function() {
      navStack.push('filter_nationality');
      currentTab = 'filter_nationality';
      render();
    };

    window.selectFilterNationality = function(name, flag) {
      tempMatchesFilter.nationality = name;
      tempMatchesFilter.nationalityFlag = flag;
      window.goBack(); // returns to matches_filter with selection echoed!
    };

    window.scrollToFilterLetter = function(letter) {
      const target = document.getElementById('filter-letter-group-' + letter);
      const container = document.getElementById('filter-country-scroll-container');
      if (target && container) {
        container.scrollTop = target.offsetTop;
      }
    };

    window.filterFilterCountries = function(query) {
      const q = (query || '').toLowerCase().trim();
      const rows = document.querySelectorAll('.filter-country-row');
      rows.forEach(r => {
        const text = (r.getAttribute('data-country') || '').toLowerCase();
        if (!q || text.includes(q)) {
          r.style.display = 'flex';
        } else {
          r.style.display = 'none';
        }
      });
    };

    window.setFilterGender = function(val) {
      tempMatchesFilter.gender = val;
      render();
    };

    window.setFilterAgeBracket = function(min, max) {
      tempMatchesFilter.minAge = min;
      tempMatchesFilter.maxAge = max;
      render();
    };

    window.updateMinAge = function(val) {
      let v = parseInt(val, 10);
      if (isNaN(v)) v = 18;
      if (v > tempMatchesFilter.maxAge) {
        v = tempMatchesFilter.maxAge;
        const minInput = document.getElementById('dual-range-min');
        if (minInput) minInput.value = v;
      }
      tempMatchesFilter.minAge = v;

      const minInput = document.getElementById('dual-range-min');
      if (minInput) minInput.style.zIndex = v > 35 ? '5' : '3';

      window.syncDualRangeUI();
      window.updateApplyButtonCount();
    };

    window.updateMaxAge = function(val) {
      let v = parseInt(val, 10);
      if (isNaN(v)) v = 50;
      if (v < tempMatchesFilter.minAge) {
        v = tempMatchesFilter.minAge;
        const maxInput = document.getElementById('dual-range-max');
        if (maxInput) maxInput.value = v;
      }
      tempMatchesFilter.maxAge = v;

      window.syncDualRangeUI();
      window.updateApplyButtonCount();
    };

    window.syncDualRangeUI = function() {
      const minAge = tempMatchesFilter.minAge;
      const maxAge = tempMatchesFilter.maxAge;
      const dispEl = document.getElementById('filter-age-display');
      if (dispEl) {
        dispEl.innerText = `${minAge} – ${maxAge >= 50 ? '50+' : maxAge} yrs`;
      }
      const highlight = document.getElementById('dual-range-highlight');
      if (highlight) {
        const leftPct = ((minAge - 18) / 32) * 100;
        const widthPct = ((maxAge - minAge) / 32) * 100;
        highlight.style.left = leftPct + '%';
        highlight.style.width = widthPct + '%';
      }
    };

    window.updateApplyButtonCount = function() {
      const count = MATCHES.filter(m => {
        if (tempMatchesFilter.nationality !== 'all' && m.nationality !== tempMatchesFilter.nationality) return false;
        if (tempMatchesFilter.gender !== 'all' && m.gender !== tempMatchesFilter.gender) return false;
        if (m.age < tempMatchesFilter.minAge || m.age > tempMatchesFilter.maxAge) return false;
        return true;
      }).length;
      const btn = document.querySelector('#app-screen .btn-aurora span');
      if (btn) btn.innerText = `Show ${count} Resonators ✨`;
    };

    window.resetTempFilter = function() {
      tempMatchesFilter = {
        nationality: 'all',
        nationalityFlag: '🌐',
        gender: 'all',
        minAge: 18,
        maxAge: 50
      };
      render();
    };

    window.applyMatchesFilter = function() {
      matchesFilter = { ...tempMatchesFilter };
      window.goBack(); // returns to matches!
    };

    window.resetMatchesFilter = function() {
      matchesFilter = {
        nationality: 'all',
        nationalityFlag: '🌐',
        gender: 'all',
        minAge: 18,
        maxAge: 50
      };
      render();
    };

    document.getElementById('phone-shell').addEventListener('wheel', (e) => {
      const horizTarget = e.target.closest('.category-pills-scroll, .match-scroll-container');
      if (horizTarget) {
        horizTarget.scrollLeft += e.deltaY;
        e.preventDefault();
        return;
      }

      const screen = document.getElementById('app-screen');
      if (screen) {
        screen.scrollTop += e.deltaY;
        e.preventDefault();
      }
    }, { passive: false });

    const toggleBtn = document.getElementById('toggle-frame-btn');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        const shell = document.getElementById('phone-shell');
        if (shell.classList.contains('full-screen')) shell.classList.remove('full-screen');
        else shell.classList.add('full-screen');
      });
    }

    render();
  </script>
</body>
</html>
